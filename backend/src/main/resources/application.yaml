spring:
  application:
    name: ticketing
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3307/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379